<div class="page" data-name="evidencia-guia">
	<div class="navbar">
		<div class="navbar-inner sliding">
			<div class="left">
				<a href="#" class="link" onclick="volver_padron_vehiculo()">
					<i class="icon icon-back"></i>
					<span class="ios-only">Back</span>
				</a>
			</div>
			<div class="title">Evidencia Guía</div>
		</div>
	</div>


	<div class="fab fab-right-bottom">
		    <a  id="btn_nueva_evidencia">
		      <i class="icon f7-icons">+</i>
		    </a>
	</div>
	<div class="page-content" id="contenido">
		
		  
		
		<div class="list media-list">
		  <ul id="listado_evidencias">
		  </ul>
		</div>

		<img style="display:none;width:90px;height:90px;" id="smallImage" src="" />

		<p class="row">  

			<form class="list" id="my-form">
				<ul>
					<li>
						<div class="item-content item-input">
							<div class="item-inner">
								<div class="item-title item-label">Número Guía</div>
								<div class="item-input-wrap">
									<input type="number" name="guiaproveedor" id="tx_guia_proveedor" onchange ="actualizar_num_guia();" placeholder="" style="border: 1px solid black;">
								</div>
							</div>
						</div>
					</li>
					<li>
						<div class="item-content item-input">
							<div class="item-inner">
								<div class="item-title item-label">Volumen</div>
								<div class="item-input-wrap">
									<input type="number" name="volumenproveedor" id="tx_volumen_proveedor" onchange="actualizar_vol_proveedor();"  placeholder="" style="border: 1px solid black;">
								</div>
							</div>
						</div>
					</li>
					<li>
						<div class="item-content item-input">
							<div class="item-inner">
								<div class="item-title item-label">Año cosecha</div>
								<div class="item-input-wrap">
									<input type="text" name="tx_anio_cosecha" id="tx_anio_cosecha" maxlength="19" onchange="actualizar_anio_cosecha();"  placeholder="" style="border: 1px solid black;">
								</div>
							</div>
						</div>
					</li>


					<li>
						<div class="item-content item-input">
							<div class="item-inner">
								<div class="item-title item-label">Comentarios</div>
								<div class="item-input-wrap">
									<textarea  id="tx_comentario" maxlength="500"  onchange="actualizar_comentarios();" name="name" style='width:100%; border: 1px solid black;'></textarea>
								</div>

							</div>
							
						</div>

						
					</li>

				</ul>

			</form>
		</p>

		<p class="row">         
			<a id="btn_emitir" data-view=".view-main" class="col button button-big button-raised button-fill">INFORMAR DESPACHO
			</a>
		</p>




	  </div>

	</div>



</div>
