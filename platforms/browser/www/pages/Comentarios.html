<div class="page" data-name="Comentarios">
	<div class="navbar">
		<div class="navbar-inner sliding">
			<div class="left">
				<a href="#" class="link" onclick="volver_volumen()">
					<i class="icon icon-back"></i>
					<span class="ios-only">Back</span>
				</a>
			</div>
			<div class="title">Emisión Guías</div>
		</div>
	</div>



	<div class="page-content" >


		

		<div class="block">
			<p class="row">
				<label style="float: left;display: inline;" id="usuario">USUARIO</label>
				<label style="float: right; display: inline;" id="zona">ZONA</label>
			</p>
		</div>



		
		<form class="list" id="my-form">
			<ul>

				<li>
					<div class="item-content item-input">
						<div class="item-inner">
							<div class="item-title item-label"></div>
							<div class="item-input-wrap">
								<div class="row">
									<div class="col"><label class="checkbox"><input id="chk_cosecha_pagada" onchange="cosecha_pagada()" type="checkbox"><i class="icon-checkbox"></i></label> Cosecha pagada</div>
									<div class="col"><label class="checkbox"><input id="chk_madera_pagada" type="checkbox" onchange="madera_pagada()"><i class="icon-checkbox"></i></label> Madera pagada </div>
								</div>



							</div>
						</div>
					</div>
				</li>


				<li>
					<div class="item-content item-input">
						<div class="item-inner">
							<div class="item-title item-label">Hora llegada</div>
							<div class="item-input-wrap">
								<input type="text" class="timepicker" id="tx_horallegada" onchange="horallegada_change()" name="horallegada" maxlength="16" placeholder="">
							</div>
						</div>
					</div>
				</li>


				<li>
					<div class="item-content item-input">
						<div class="item-inner">
							<div class="item-title item-label">Hora salida</div>
							<div class="item-input-wrap">
								<input type="text" class="timepicker" id="tx_horasalida" onchange="horasalida_change()" name="horasalida" maxlength="16" placeholder="">
							</div>
						</div>
					</div>
				</li>


				<li>
					<div class="item-content item-input">
						<div class="item-inner">
							<div class="item-title item-label">Sector origen</div>
							<div class="item-input-wrap">
								<input type="text" name="sectororigen" id="tx_sector_origen" maxlength="30" onchange="	sectororigen_change()"	 placeholder="">
							</div>
						</div>
					</div>
				</li>


				<li>
					<div class="item-content item-input">
						<div class="item-inner">
							<div class="item-title item-label">Sector Destino</div>
							<div class="item-input-wrap">
								<input type="text" name="destino" id="tx_destino" maxlength="30" onchange="destino_change()" placeholder="">
							</div>
						</div>
					</div>
				</li>



				<li>
					<div class="item-content item-input">
						<div class="item-inner">
							<div class="item-title item-label">Guia proveedor</div>
							<div class="item-input-wrap">
								<input type="number" name="guiaproveedor" id="tx_guia_proveedor" placeholder="" onchange="guiaproveedor_change()" >
							</div>
						</div>
					</div>
				</li>

				<li>
					<div class="item-content item-input">
						<div class="item-inner">
							<div class="item-title item-label">Volumen proveedor</div>
							<div class="item-input-wrap">
								<input type="number" name="volumenproveedor" id="tx_volumen_proveedor" onchange="volumenproveedor_change()" placeholder="">
							</div>
						</div>
					</div>
				</li>

				<li>
					<div class="item-content item-input">
						<div class="item-inner">
							<div class="item-title item-label">Año cosecha</div>
							<div class="item-input-wrap">
								<input type="text" name="aniocosecha" id="tx_anio_cosecha" maxlength="19"  onchange="aniocosecha_change()" placeholder="">
							</div>
						</div>
					</div>
				</li>

				<li>
					<div class="item-content item-input">
						<div class="item-inner">
							<div class="item-title item-label">Año Plantación</div>
							<div class="item-input-wrap">
								<input type="number" name="anioplantacion" id="tx_anio_plantacion"  onchange="anioplantacion_change()" placeholder="">
							</div>
						</div>
					</div>
				</li>


				<li>
					<div class="item-content item-input">
						<div class="item-inner">
							<div class="item-title item-label">Plan de Manejo</div>
							<div class="item-input-wrap">
								<input type="text" name="planmanejo" id="tx_plan_manejo"  onchange="plan_manejo_change()" placeholder="">
							</div>
						</div>
					</div>
				</li>

				<li>
					<div class="item-content item-input">
						<div class="item-inner">
							<div class="item-title item-label">Comentarios</div>
							<div class="item-input-wrap">
								<textarea  id="tx_comentario" maxlength="500"  onchange="comentario_change()" name="name" ></textarea>
							</div>

						</div>
						
					</div>

					
				</li>
			</ul>
		</form>


			<div class="block">
				<p class="row">  
				       
				   <a onclick="pagina_impresion()" data-view=".view-main" class="col button button-big button-raised button-fill" id="ver_impresions">Finalizar Guía
					</a>
					<!--<button class="col button button-big button-raised button-fill" style="width:5%; "> +</button>-->
				</p>



		
			</div>

	</div>
	

</div>
