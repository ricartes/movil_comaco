<div class="page" data-name="qr-trazabilidad">
    <div class="navbar">
        <div class="navbar-inner sliding">
            <div class="left">
                <a href="#" class="link back">
                    <i class="icon icon-back"></i>
                    <span class="ios-only">Atrás</span>
                </a>
            </div>
            <div class="title">QR Trazabilidad</div>
        </div>
    </div>

    <div class="page-content">
        <div class="block-title">

        </div>

        <div class="list">
            <ul>
                <li id="item-select-qr-trazabilidad">
                    <a href="#" class="item-link smart-select" data-open-in="sheet"

                        <select id="combo_qr_trazabilidad" name="combo_qr_trazabilidad">
                            <option value="">Cargando guías...</option>
                        </select>

                        <div class="item-content">
                            <div class="item-inner qr-trazabilidad-select-inner">

                                </div>
                            </div>
                        </div>

                </li>
            </ul>
        </div>

        <div class="block">
            <p id="qr_trazabilidad_info" style="color: black;">
                Seleccione una guía para visualizar su QR.
            </p>
        </div>

        <div class="block qr-trazabilidad-block">
            <div id="qrcode_trazabilidad"></div>
        </div>

        <div class="block">
            <p id="qr_trazabilidad_estado" style="color: black;"></p>
