name: Validar finalización asíncrona

on:
  pull_request:
    paths:
      - 'plugins-local/cordova-plugin-comaco-tracking/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/validar-finalizacion-asincrona.yml'
  workflow_dispatch:

jobs:
  contrato-finalizacion:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar prueba focalizada
        run: node --test tests/finalizacion-asincrona.test.js

  suite-node:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar contratos históricos por archivo
        shell: bash
        run: |
          set +e
          failed=0
          files=$(node -e "const p=require('./package.json'); console.log(p.scripts.test.split(/\\s+/).filter(x=>x.endsWith('.js') && !x.endsWith('finalizacion-asincrona.test.js')).join(' '))")
          for file in $files; do
            output=$(mktemp)
            node --test --experimental-test-isolation=none "$file" >"$output" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "::error title=Contrato histórico fallido::$file"
              tail -n 80 "$output"
              failed=1
            fi
            rm -f "$output"
          done
          exit "$failed"
