name: Validar finalización asíncrona

on:
  pull_request:
    paths:
      - 'plugins-local/cordova-plugin-comaco-tracking/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/validar-finalizacion-asincrona.yml'
  workflow_dispatch:

jobs:
  contrato-finalizacion:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar prueba focalizada
        run: node --test tests/finalizacion-asincrona.test.js

  suite-node:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar suite completo
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tail -n 140
