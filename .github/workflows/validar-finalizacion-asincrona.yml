name: Validar finalización asíncrona

on:
  pull_request:
    paths:
      - 'plugins-local/cordova-plugin-comaco-tracking/**'
      - 'tests/**'
      - '.github/workflows/validar-finalizacion-asincrona.yml'
  workflow_dispatch:

jobs:
  contrato-finalizacion:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar pruebas focalizadas
        run: >-
          node --test
          tests/finalizacion-asincrona.test.js
          tests/position-cutoff-discard.test.js

  suite-node:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar contratos autocontenidos
        id: contratos
        shell: bash
        run: |
          set +e
          failed=0
          : > failed-tests.txt
          files=$(node -e "const p=require('./package.json'); console.log(p.scripts.test.split(/\s+/).filter(x=>x.endsWith('.js') && !x.endsWith('qr-guias-contract.test.js')).join(' '))")
          for file in $files; do
            output=$(mktemp)
            node --test --experimental-test-isolation=none "$file" >"$output" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              {
                echo "===== $file ====="
                tail -n 80 "$output"
                echo
              } >> failed-tests.txt
              failed=1
            fi
            rm -f "$output"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Publicar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contratos-historicos-fallidos
          path: failed-tests.txt
          if-no-files-found: error

      - name: Fallar si existe un contrato incompatible
        if: steps.contratos.outputs.failed != '0'
        shell: bash
        run: |
          cat failed-tests.txt
          exit 1

  contrato-qr-guias:
    runs-on: ubuntu-latest
    env:
      GDE_REPOSITORY_TOKEN: ${{ secrets.GDE_REPOSITORY_TOKEN }}
    steps:
      - name: Obtener aplicación de Trazabilidad
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detectar credencial del repositorio GDE
        id: credencial
        shell: bash
        run: |
          if [ -n "${GDE_REPOSITORY_TOKEN:-}" ]; then
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Obtener aplicación GDE
        if: steps.credencial.outputs.disponible == 'true'
        uses: actions/checkout@v4
        with:
          repository: ricartes/movil_comaco_gde
          ref: desarrollo
          path: .ci/movil_comaco_gde
          token: ${{ secrets.GDE_REPOSITORY_TOKEN }}
          persist-credentials: false

      - name: Preparar ruta histórica del contrato
        if: steps.credencial.outputs.disponible == 'true'
        shell: bash
        run: |
          destino="$GITHUB_WORKSPACE/../../movil_comaco_gde"
          rm -rf "$destino"
          ln -s "$GITHUB_WORKSPACE/.ci/movil_comaco_gde" "$destino"
          test -f "$destino/www/js/Datos/Migraciones/Versiones.js"
          test -f "$destino/www/js/Datos/QrAsociacionGde.js"
          test -f "$destino/www/js/Services/QrTrazabilidadService.js"
          test -f "$destino/www/js/Services/QrAsociacionGdeService.js"

      - name: Ejecutar contrato QR entre aplicaciones
        if: steps.credencial.outputs.disponible == 'true'
        run: >-
          node --test --experimental-test-isolation=none
          tests/qr-guias-contract.test.js

      - name: Informar credencial pendiente
        if: steps.credencial.outputs.disponible != 'true'
        shell: bash
        run: |
          echo "::warning title=Contrato QR no ejecutado::Configura el secreto GDE_REPOSITORY_TOKEN con acceso de solo lectura a ricartes/movil_comaco_gde para ejecutar el test interrepositorio."
