name: Validar finalización asíncrona

on:
  pull_request:
    paths:
      - 'plugins-local/cordova-plugin-comaco-tracking/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/validar-finalizacion-asincrona.yml'
  workflow_dispatch:

jobs:
  contratos-node:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar pruebas
        run: npm test
