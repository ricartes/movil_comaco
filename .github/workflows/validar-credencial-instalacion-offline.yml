name: Validar credencial offline

on:
  pull_request:
    paths:
      - 'www/js/Helper/gpsTracking.js'
      - 'www/js/Services/SeguimientoBootstrap.js'
      - 'tests/credencial-instalacion-offline.test.js'
      - 'package.json'
      - '.github/workflows/validar-credencial-instalacion-offline.yml'
  workflow_dispatch:

jobs:
  contrato-credencial:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar contrato focalizado
        run: node --test tests/credencial-instalacion-offline.test.js

  regresion:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        archivo:
          - tests/seguimiento-sqlite.test.js
          - tests/sqlite-schema-v9.test.js
          - tests/qr-guias-contract.test.js
          - tests/envio-datos-programador.test.js
          - tests/comaco-tracking-native.test.js
          - tests/offline-first-tracking.test.js
          - tests/tracking-power-policy.test.js
          - tests/device-audit.test.js
          - tests/finalizacion-manual.test.js
          - tests/finalization-drain-priority.test.js
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar ${{ matrix.archivo }}
        run: node --test --experimental-test-isolation=none "${{ matrix.archivo }}"
